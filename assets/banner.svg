<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="45%" stop-color="#0d0221"/>
      <stop offset="100%" stop-color="#05010f"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6ec7"/>
      <stop offset="70%" stop-color="#ff006e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff006e" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glitch">
      <feTurbulence type="fractalNoise" baseFrequency="0.0 0.9" numOctaves="1" seed="3" result="noise">
        <animate attributeName="seed" values="1;9;3;7;1" dur="4s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G">
        <animate attributeName="scale" values="0;6;0;4;0" dur="3s" repeatCount="indefinite"/>
      </feDisplacementMap>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#16213e" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- BG -->
  <rect width="1000" height="320" fill="url(#sky)"/>
  <rect width="1000" height="320" fill="url(#grid)" opacity="0.5"/>

  <!-- MATRIX RAIN -->
  <g fill="#00fff9" opacity="0.35" font-size="14" font-family="monospace">
    <text x="60" y="0">10X01<span><animate attributeName="y" values="-40;360" dur="5s" repeatCount="indefinite"/></span></text>
    <text x="140" y="0" fill="#ff006e">H4CK<tspan><animate attributeName="y" values="-80;360" dur="7s" repeatCount="indefinite"/></tspan></text>
    <text x="220" y="0">N3ON<span><animate attributeName="y" values="-20;360" dur="6s" repeatCount="indefinite"/></span></text>
    <text x="760" y="0" fill="#8b5cf6">S4B0<span><animate attributeName="y" values="-60;360" dur="5.5s" repeatCount="indefinite"/></span></text>
    <text x="840" y="0">X0R<span><animate attributeName="y" values="-30;360" dur="6.5s" repeatCount="indefinite"/></span></text>
    <text x="910" y="0" fill="#ff006e">R00T<span><animate attributeName="y" values="-90;360" dur="4.5s" repeatCount="indefinite"/></span></text>
  </g>

  <!-- Moon -->
  <circle cx="820" cy="80" r="90" fill="url(#moon)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="80" r="34" fill="#ffb3de" opacity="0.85" filter="url(#glow)"/>

  <!-- Skyline (left) -->
  <g fill="#0a0e27" stroke="#00fff9" stroke-width="0.8" opacity="0.9">
    <rect x="40" y="200" width="34" height="120"/>
    <rect x="80" y="160" width="28" height="160"/>
    <rect x="114" y="220" width="40" height="100"/>
    <rect x="160" y="140" width="24" height="180"/>
    <rect x="190" y="190" width="36" height="130"/>
  </g>
  <!-- Skyline (right) -->
  <g fill="#0a0e27" stroke="#ff006e" stroke-width="0.8" opacity="0.9">
    <rect x="600" y="180" width="34" height="140"/>
    <rect x="640" y="150" width="26" height="170"/>
    <rect x="672" y="210" width="38" height="110"/>
    <rect x="716" y="130" width="22" height="190"/>
    <rect x="744" y="195" width="34" height="125"/>
    <rect x="920" y="200" width="40" height="120"/>
  </g>

  <!-- Scanline -->
  <rect x="0" y="0" width="1000" height="2" fill="#00fff9" opacity="0.6">
    <animate attributeName="y" values="0;318;0" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- AVATAR -->
  <g transform="translate(300,90)" filter="url(#glow)">
    <circle r="58" fill="none" stroke="#00fff9" stroke-width="2">
      <animate attributeName="r" values="56;60;56" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#00fff9;#ff006e;#00fff9" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle r="48" fill="#0d0221" stroke="#8b5cf6" stroke-width="1"/>
    <path d="M-22 -10 Q0 -28 22 -10 L22 14 Q0 30 -22 14 Z" fill="#1a0533" stroke="#ff006e" stroke-width="1.2"/>
    <circle cx="-11" cy="-2" r="4" fill="#00fff9"><animate attributeName="fill" values="#00fff9;#ff006e;#00fff9" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="11" cy="-2" r="4" fill="#00fff9"><animate attributeName="fill" values="#00fff9;#ff006e;#00fff9" dur="2s" repeatCount="indefinite"/></circle>
    <path d="M-12 16 Q0 22 12 16" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>

  <!-- NAME GLITCH -->
  <g transform="translate(640,140)" text-anchor="middle">
    <text y="0" font-size="52" font-weight="bold" fill="#ff006e" opacity="0.7" filter="url(#glitch)" letter-spacing="6" transform="translate(-3,0)">SABO</text>
    <text y="0" font-size="52" font-weight="bold" fill="#00fff9" filter="url(#glow)" letter-spacing="6">SABO
      <animate attributeName="opacity" values="1;0.8;1" dur="2s" repeatCount="indefinite"/>
    </text>
    <text y="34" font-size="15" fill="#8b5cf6" letter-spacing="2">FULL STACK · AI ENGINEER</text>
    <text y="56" font-size="12" fill="#ff006e" letter-spacing="1">SABOLABS SECURITY // CYBERPUNK DEV</text>
    <text y="78" font-size="11" fill="#555" letter-spacing="1">「コードは詩、夜は永遠」</text>
  </g>

  <!-- Tokyo time -->
  <text x="500" y="300" font-size="11" fill="#00fff9" text-anchor="middle" opacity="0.5" font-family="monospace">TOKYO // 35.6762°N 139.6503°E</text>
</svg>
