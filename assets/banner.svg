<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="45%" stop-color="#0d0221"/>
      <stop offset="100%" stop-color="#05010f"/>
    </linearGradient>
    <linearGradient id="neonC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00fff9"/>
      <stop offset="100%" stop-color="#00fff9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="neonP" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff006e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ff006e"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6ec7"/>
      <stop offset="70%" stop-color="#ff006e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff006e" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#16213e" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- BG -->
  <rect width="1000" height="320" fill="url(#sky)"/>
  <rect width="1000" height="320" fill="url(#grid)" opacity="0.5"/>

  <!-- Moon -->
  <circle cx="820" cy="80" r="90" fill="url(#moon)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="80" r="34" fill="#ffb3de" opacity="0.85" filter="url(#glow)"/>

  <!-- Skyline (left cluster) -->
  <g fill="#0a0e27" stroke="#00fff9" stroke-width="0.8" opacity="0.9">
    <rect x="40" y="200" width="34" height="120"/>
    <rect x="80" y="160" width="28" height="160"/>
    <rect x="114" y="220" width="40" height="100"/>
    <rect x="160" y="140" width="24" height="180"/>
    <rect x="190" y="190" width="36" height="130"/>
    <rect x="232" y="170" width="30" height="150"/>
  </g>
  <!-- Skyline (right cluster) -->
  <g fill="#0a0e27" stroke="#ff006e" stroke-width="0.8" opacity="0.9">
    <rect x="600" y="180" width="34" height="140"/>
    <rect x="640" y="150" width="26" height="170"/>
    <rect x="672" y="210" width="38" height="110"/>
    <rect x="716" y="130" width="22" height="190"/>
    <rect x="744" y="195" width="34" height="125"/>
    <rect x="884" y="170" width="30" height="150"/>
    <rect x="920" y="200" width="40" height="120"/>
  </g>
  <!-- Window lights -->
  <g fill="#00fff9" opacity="0.7">
    <rect x="48" y="215" width="4" height="6"/><rect x="58" y="230" width="4" height="6"/><rect x="88" y="175" width="4" height="6"/><rect x="96" y="200" width="4" height="6"/>
    <rect x="168" y="155" width="4" height="6"/><rect x="174" y="185" width="4" height="6"/><rect x="200" y="205" width="4" height="6"/>
  </g>
  <g fill="#ff006e" opacity="0.7">
    <rect x="648" y="165" width="4" height="6"/><rect x="654" y="195" width="4" height="6"/><rect x="724" y="145" width="4" height="6"/><rect x="730" y="180" width="4" height="6"/>
    <rect x="892" y="185" width="4" height="6"/><rect x="930" y="215" width="4" height="6"/>
  </g>

  <!-- Scanline sweep -->
  <rect x="0" y="0" width="1000" height="2" fill="url(#neonC)" opacity="0.6">
    <animate attributeName="y" values="0;318;0" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- Center divider glow line -->
  <line x1="500" y1="40" x2="500" y2="280" stroke="url(#neonP)" stroke-width="1" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- AVATAR (geometric cyberpunk) left -->
  <g transform="translate(300,90)" filter="url(#glow)">
    <circle r="58" fill="none" stroke="#00fff9" stroke-width="2">
      <animate attributeName="r" values="56;60;56" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#00fff9;#ff006e;#00fff9" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle r="48" fill="#0d0221" stroke="#8b5cf6" stroke-width="1"/>
    <!-- face silhouette -->
    <path d="M-22 -10 Q0 -28 22 -10 L22 14 Q0 30 -22 14 Z" fill="#1a0533" stroke="#ff006e" stroke-width="1.2"/>
    <circle cx="-11" cy="-2" r="4" fill="#00fff9"><animate attributeName="fill" values="#00fff9;#ff006e;#00fff9" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="11" cy="-2" r="4" fill="#00fff9"><animate attributeName="fill" values="#00fff9;#ff006e;#00fff9" dur="2s" repeatCount="indefinite"/></circle>
    <path d="M-12 16 Q0 22 12 16" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <!-- circuit lines -->
    <path d="M-58 0 H-70 M58 0 H70 M0 -58 V-70 M0 58 V70" stroke="#00fff9" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- NAME + TITLE right -->
  <g transform="translate(640,140)" text-anchor="middle">
    <text y="0" font-size="46" font-weight="bold" fill="#00fff9" filter="url(#glow)" letter-spacing="4">SABO
      <animate attributeName="opacity" values="1;0.7;1" dur="2.5s" repeatCount="indefinite"/>
    </text>
    <text y="34" font-size="15" fill="#ff006e" letter-spacing="2">FULL STACK · AI ENGINEER</text>
    <text y="56" font-size="12" fill="#8b5cf6" letter-spacing="1">SABOLABS SECURITY // CYBERPUNK DEV</text>
    <text y="78" font-size="11" fill="#555" letter-spacing="1">「コードは詩、夜は永遠」</text>
  </g>

  <!-- bottom status bar -->
  <line x1="40" y1="300" x2="960" y2="300" stroke="#222" stroke-width="1"/>
  <text x="40" y="314" font-size="10" fill="#444">[SABO]::SABOLABS::v2.0</text>
  <text x="430" y="314" font-size="10" fill="#444">CYBERPUNK_REPOS // 83</text>
  <text x="760" y="314" font-size="10" fill="#ff006e" opacity="0.5">▓ NET: UPLINK SECURE</text>
</svg>
