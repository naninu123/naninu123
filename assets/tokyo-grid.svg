<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0221"/>
      <stop offset="50%" stop-color="#1a0533"/>
      <stop offset="100%" stop-color="#0d0221"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#00fff9"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#ff006e"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a0533" stroke-width="0.5"/>
    </pattern>
    <pattern id="gridBold" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#2a0a4a" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="url(#bg)"/>
  <rect width="800" height="300" fill="url(#grid)"/>
  <rect width="800" height="300" fill="url(#gridBold)"/>

  <!-- Horizontal neon scan line -->
  <line x1="0" y1="40" x2="800" y2="40" stroke="url(#neonCyan)" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="80" x2="800" y2="80" stroke="url(#neonPink)" stroke-width="0.5" opacity="0.2"/>
  <line x1="0" y1="120" x2="800" y2="120" stroke="url(#neonCyan)" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="160" x2="800" y2="160" stroke="url(#neonPink)" stroke-width="0.5" opacity="0.2"/>
  <line x1="0" y1="200" x2="800" y2="200" stroke="url(#neonCyan)" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="240" x2="800" y2="240" stroke="url(#neonPink)" stroke-width="0.5" opacity="0.2"/>
  <line x1="0" y1="280" x2="800" y2="280" stroke="url(#neonCyan)" stroke-width="0.5" opacity="0.3"/>

  <!-- Vertical neon beams -->
  <rect x="80" y="0" width="2" height="300" fill="url(#neonCyan)" opacity="0.15"/>
  <rect x="200" y="0" width="2" height="300" fill="url(#neonPink)" opacity="0.12"/>
  <rect x="340" y="0" width="2" height="300" fill="url(#neonPurple)" opacity="0.15"/>
  <rect x="460" y="0" width="2" height="300" fill="url(#neonCyan)" opacity="0.12"/>
  <rect x="600" y="0" width="2" height="300" fill="url(#neonPink)" opacity="0.15"/>
  <rect x="720" y="0" width="2" height="300" fill="url(#neonPurple)" opacity="0.12"/>

  <!-- Large neon corner brackets -->
  <path d="M 40 40 L 40 30 L 50 30" stroke="#00fff9" stroke-width="2" fill="none" filter="url(#glow)" opacity="0.6"/>
  <path d="M 760 30 L 770 30 L 770 40" stroke="#ff006e" stroke-width="2" fill="none" filter="url(#glow)" opacity="0.6"/>
  <path d="M 40 270 L 40 260" stroke="#8b5cf6" stroke-width="2" fill="none" filter="url(#glow)" opacity="0.6"/>
  <path d="M 760 260 L 760 270 L 770 270" stroke="#00fff9" stroke-width="2" fill="none" filter="url(#glow)" opacity="0.6"/>

  <!-- Neon ring (center) -->
  <circle cx="400" cy="120" r="45" fill="none" stroke="#00fff9" stroke-width="0.8" opacity="0.3" filter="url(#glow)">
    <animate attributeName="r" values="45;55;45" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="120" r="35" fill="none" stroke="#ff006e" stroke-width="0.6" opacity="0.25" filter="url(#glow)">
    <animate attributeName="r" values="35;45;35" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Japanese text -->
  <text x="400" y="112" text-anchor="middle" font-family="'Yu Gothic','MS Gothic','Hiragino Sans',sans-serif" font-size="22" fill="#00fff9" opacity="0.7" filter="url(#glowStrong)">
    サイバーパンク開発者
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="400" y="138" text-anchor="middle" font-family="'Yu Gothic','MS Gothic','Hiragino Sans',sans-serif" font-size="14" fill="#8b5cf6" opacity="0.5">
    ＜ コードは詩、夜は永遠 ＞
  </text>

  <!-- Mini status boxes -->
  <g transform="translate(558,45)" opacity="0.5">
    <rect width="180" height="55" rx="4" fill="none" stroke="#00fff9" stroke-width="0.5" opacity="0.6"/>
    <text x="10" y="18" font-family="'Courier New',monospace" font-size="9" fill="#00fff9">NODE: active</text>
    <text x="10" y="32" font-family="'Courier New',monospace" font-size="9" fill="#c9d1d9">SYS: online</text>
    <text x="10" y="46" font-family="'Courier New',monospace" font-size="9" fill="#ff006e">NET: uplink stable</text>
    <circle cx="168" cy="12" r="3" fill="#00fff9" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Bottom status bar -->
  <line x1="40" y1="260" x2="760" y2="260" stroke="#333" stroke-width="0.5"/>

  <text x="50" y="280" font-family="'Courier New',monospace" font-size="10" fill="#555">
    [SABO]::SABOLABS::v2.0
  </text>
  <text x="420" y="280" font-family="'Courier New',monospace" font-size="10" fill="#555">
    CYBERPUNK_REPOS // 83
  </text>
  <text x="660" y="280" font-family="'Courier New',monospace" font-size="10" fill="#ff006e" opacity="0.4">
    ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓░░░ 83%
  </text>
</svg>
