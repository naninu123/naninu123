<svg width="1000" height="140" viewBox="0 0 1000 140" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0221"/><stop offset="100%" stop-color="#1a0533"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="140" rx="10" fill="url(#bg)" stroke="#222" stroke-width="1"/>

  <text x="30" y="36" font-size="15" font-weight="bold" fill="#00fff9" letter-spacing="2" filter="url(#g)">▸ NOW BUILDING</text>
  <line x1="30" y1="48" x2="970" y2="48" stroke="#222" stroke-width="1"/>

  <!-- project card 1 -->
  <g transform="translate(30,65)">
    <rect width="300" height="60" rx="6" fill="#0a0e27" stroke="#00fff9" stroke-width="0.8" opacity="0.7"/>
    <text x="15" y="24" font-size="13" font-weight="bold" fill="#00fff9">quantum-web3</text>
    <text x="15" y="44" font-size="10" fill="#8b5cf6">TypeScript · Web3 · Active</text>
    <rect x="220" y="16" width="8" height="8" rx="4" fill="#00fff9">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- project card 2 -->
  <g transform="translate(350,65)">
    <rect width="300" height="60" rx="6" fill="#0a0e27" stroke="#ff006e" stroke-width="0.8" opacity="0.7"/>
    <text x="15" y="24" font-size="13" font-weight="bold" fill="#ff006e">ai-agent-security</text>
    <text x="15" y="44" font-size="10" fill="#8b5cf6">AI · Security · Auditing</text>
    <rect x="220" y="16" width="8" height="8" rx="4" fill="#ff006e">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- project card 3 -->
  <g transform="translate(670,65)">
    <rect width="300" height="60" rx="6" fill="#0a0e27" stroke="#8b5cf6" stroke-width="0.8" opacity="0.7"/>
    <text x="15" y="24" font-size="13" font-weight="bold" fill="#8b5cf6">circle-bbp-dos</text>
    <text x="15" y="44" font-size="10" fill="#00fff9">Solidity · POC · Research</text>
    <rect x="220" y="16" width="8" height="8" rx="4" fill="#8b5cf6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="500" y="135" font-size="9" fill="#333" text-anchor="middle">[ LIVE_BUILD // SABOLABS_NODE // 3 PROJECTS ]</text>
</svg>
