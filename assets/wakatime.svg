<svg width="1000" height="180" viewBox="0 0 1000 180" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0221"/><stop offset="100%" stop-color="#1a0533"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="ts" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00fff9"/><stop offset="100%" stop-color="#00fff9" stop-opacity="0"/></linearGradient>
    <linearGradient id="py" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ff006e"/><stop offset="100%" stop-color="#ff006e" stop-opacity="0"/></linearGradient>
    <linearGradient id="rs" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
    <linearGradient id="js" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ffd700"/><stop offset="100%" stop-color="#ffd700" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1000" height="180" rx="10" fill="url(#bg)" stroke="#222" stroke-width="560"/>

  <text x="30" y="36" font-size="15" font-weight="bold" fill="#00fff9" letter-spacing="2" filter="url(#g)">▸ CODING TIME // WAKATIME</text>
  <line x1="30" y1="48" x2="970" y2="48" stroke="#222" stroke-width="1"/>

  <!-- total hours big -->
  <text x="30" y="95" font-size="36" font-weight="bold" fill="#ff006e" filter="url(#g)">3m</text>
  <text x="30" y="118" font-size="11" fill="#8b5cf6">LAST 7 DAYS</text>

  <!-- language bars -->
  <g transform="translate(380,68)">
    <!-- TypeScript -->
    <text x="0" y="0" font-size="12" fill="#c9d1d9">TypeScript</text>
    <text x="560" y="0" font-size="12" fill="#00fff9" text-anchor="end">100.0%</text>
    <rect x="0" y="8" width="560" height="10" rx="5" fill="#0a0e27" stroke="#16213e" stroke-width="0.5"/>
    <rect x="0" y="8" width="270" height="10" rx="5" fill="url(#ts)"/>

    <!-- Python -->
    <text x="0" y="32" font-size="12" fill="#c9d1d9">Python</text>
    <text x="560" y="32" font-size="12" fill="#ff006e" text-anchor="end">24.1%</text>
    <rect x="0" y="40" width="560" height="10" rx="5" fill="#0a0e27" stroke="#16213e" stroke-width="0.5"/>
    <rect x="0" y="40" width="135" height="10" rx="5" fill="url(#py)"/>

    <!-- Rust -->
    <text x="0" y="64" font-size="12" fill="#c9d1d9">Rust</text>
    <text x="560" y="64" font-size="12" fill="#8b5cf6" text-anchor="end">15.3%</text>
    <rect x="0" y="72" width="560" height="10" rx="5" fill="#0a0e27" stroke="#16213e" stroke-width="0.5"/>
    <rect x="0" y="72" width="86" height="10" rx="5" fill="url(#rs)"/>

    <!-- JavaScript -->
    <text x="0" y="96" font-size="12" fill="#c9d1d9">JavaScript</text>
    <text x="560" y="96" font-size="12" fill="#ffd700" text-anchor="end">12.4%</text>
    <rect x="0" y="104" width="560" height="10" rx="5" fill="#0a0e27" stroke="#16213e" stroke-width="0.5"/>
    <rect x="0" y="104" width="69" height="10" rx="5" fill="url(#js)"/>
  </g>

  <text x="500" y="175" font-size="9" fill="#333" text-anchor="middle">[ WAKATIME_API // SABOLABS_NODE ]</text>
</svg>
