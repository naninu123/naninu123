name: Update Stats SVG

on:
  schedule:
    - cron: "13 3 * * *"   # 03:13 UTC daily
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch GitHub data and rewrite stats.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER: naninu123
        run: |
          pip install requests >/dev/null 2>&1
          python3 - <<'PY'
          import os, json, urllib.request

          user = os.environ["USER"]
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent":"stats-bot"})
              return json.load(urllib.request.urlopen(req, timeout=20))

          u = get(f"https://api.github.com/users/{user}")
          repos = get(f"https://api.github.com/users/{user}/repos?per_page=100&type=owner")
          stars = sum(r.get("stargazers_count",0) for r in repos if not r.get("fork"))
          followers = u.get("followers",0)
          following = u.get("following",0)
          publics = u.get("public_repos",0)

          path = "assets/stats.svg"
          s = open(path).read()
          import re
          def repl(s, old, new):
              return s.replace(f'">{old}<', f'">{new}<', 1)
          s = repl(s, "83", str(publics))
          s = repl(s, "9", str(stars))
          s = repl(s, "5", str(followers))
          open(path,"w").write(s)

          # Language distribution
          langs = {}
          for r in repos:
              l = r.get("language")
              if l and not r.get("fork"):
                  langs[l] = langs.get(l,0) + 1
          total = sum(langs.values()) or 1
          top = sorted(langs.items(), key=lambda x:-x[1])[:4]
          names = [f'{n} ' for n,c in top]
          pcts = [f'{c/total*100:.1f}%' for n,c in top]
          # write langs.svg
          lp = "assets/langs.svg"
          ls = open(lp).read()
          # simple: replace first % value + width by recompute bars
          import re as _re
          # bars width scale: 820px = 100%
          scales = {"TypeScript":451, "HTML":205, "Shell":164, "Other":164}
          for name, pct in zip([n for n,c in top], [c/total*100 for n,c in top]):
              w = int(820 * pct/100)
              # find bar rect after the matching label text
              pat = _re.compile(r'(<text[^>]*>'+_re.escape(name)+r'<.*?</text>\s*<rect[^>]*/>\s*<rect[^>]*width=")\d+(")')
              ls = pat.sub(lambda m: m.group(1)+str(w)+m.group(2), ls, count=1)
              # label pct
              ls = _re.sub(r'(<text[^>]*'+_re.escape(name)+r'<.*?</text>\s*<text[^>]*>)[^<]*(</text>)', lambda m: m.group(1)+f'{pct:.1f}%'+m.group(2), ls, count=1)
          open(lp,"w").write(ls)
          print("updated:", publics, stars, followers, "langs:", top)
          PY
      - name: Commit
        run: |
          git config user.name "stats-bot"
          git config user.email "bot@sabolabs.dev"
          git add assets/stats.svg assets/langs.svg
          git commit -m "chore: auto-update stats" || echo "no change"
          git push
